name: Wrong result
description: The checker said something is blocked when it isn't, or the other way around.
title: "Wrong result: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Wrong results are the most useful reports this project gets.
        Please don't include anything you consider private, such as your home IP address.
  - type: input
    id: target
    attributes:
      label: Domain or IP checked
      placeholder: example.com
    validations:
      required: true
  - type: dropdown
    id: filter
    attributes:
      label: Which DNS filter do you use?
      options:
        - Telenor Nettvern
        - Telenor Nettvern+
        - Telenor SafeZone
        - Cloudflare
        - Quad9
        - OpenDNS
        - AdGuard
        - CleanBrowsing
        - Another filter
        - None
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: What went wrong?
      options:
        - Reported as blocked, but it is not blocked
        - Reported as not blocked, but it is blocked
        - Reported the wrong filter
        - Something else
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Home broadband
        - Mobile data or a phone hotspot
        - Work or school network
        - VPN
        - Not sure
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Program output
      description: Paste the output of `nbchecker --json <domain>`, or copy it from the interactive screen with `y`.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and how you know
      description: For example, what you saw when opening the site in a browser.
  - type: input
    id: version
    attributes:
      label: nbchecker version
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true
