# GoReleaser config: https://goreleaser.com/customization/
version: 2

project_name: nbchecker

before:
  hooks:
    # Every platform's native OpenTUI package, so one runner can build all.
    - bun install --frozen-lockfile --os=* --cpu=*

builds:
  # Standalone executables with Bun built in, so nothing else is needed to
  # run them. GoReleaser's Bun builder needs --compile in the flags.
  - id: nbchecker
    builder: bun
    main: ./src/main.ts
    binary: nbchecker
    targets:
      - linux-x64
      - linux-arm64
      - darwin-x64
      - darwin-arm64
    flags:
      - --compile
      - --minify
      - --define=NBCHECKER_VERSION="{{ .Version }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

# Sign and notarize the macOS binaries so Gatekeeper opens them. This runs
# from Linux, and only when the signing secrets are set; the release
# workflow refuses to run without them.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [nbchecker]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
        entitlements: ./release/entitlements.plist
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

homebrew_casks:
  - name: nbchecker
    repository:
      owner: martinthommesen
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/martinthommesen/nbchecker
    description: Checks whether DNS filters block a domain or IP address
    license: MIT
    commit_author:
      name: nbchecker release
      email: noreply@github.com
    # Leave the tap alone when the release runs without its token.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

changelog:
  use: github-native

release:
  prerelease: auto
